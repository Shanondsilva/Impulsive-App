<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email verified | Impulsive</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #100b18;
        --text: #f7f0ff;
        --muted: #c9bdd8;
        --accent: #d0c3f1;
        --accent-strong: #eee8ff;
        --accent-text: #21153b;
        --panel: #191123;
        --ring: rgba(208, 195, 241, 0.24);
        --glow: rgba(208, 195, 241, 0.18);
        --hero: rgba(126, 94, 196, 0.3);
        --shadow: rgba(0, 0, 0, 0.38);
        --focus: #d0c3f1;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #fffefc;
          --text: #211b2c;
          --muted: #655d72;
          --accent: #7d5fc4;
          --accent-strong: #6448a8;
          --accent-text: #ffffff;
          --panel: #ffffff;
          --ring: #eadff8;
          --glow: rgba(100, 72, 168, 0.12);
          --hero: #f6efff;
          --shadow: rgba(76, 55, 118, 0.12);
          --focus: #d9c9f2;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, var(--hero) 0, transparent 34rem),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 440px);
        padding: 32px 28px;
        border: 1px solid var(--ring);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 70px var(--shadow);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 2.75rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .helper {
        margin-top: 14px;
      }

      button {
        width: 100%;
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 14px 28px var(--glow);
      }

      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      button:hover {
        background: var(--accent-strong);
      }

      a {
        display: inline-block;
        margin-top: 18px;
        color: var(--accent-strong);
        font-size: 0.95rem;
        font-weight: 650;
        text-decoration: none;
      }

      a:focus-visible,
      a:hover {
        text-decoration: underline;
      }
    </style>
    <script>
      const verifiedUrl = "https://useimpulsive.com/auth/verified";

      function openImpulsive() {
        window.location.href = verifiedUrl;
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Email verified</h1>
      <p>Your email has been verified. Open Impulsive to continue.</p>
      <p class="helper">If the app is installed, use the button below to open the verified App Link.</p>
      <button onclick="openImpulsive()">Open Impulsive</button>
      <a href="/">Back to Impulsive website</a>
    </main>
  </body>
</html>
