appId: com.impulsive.app
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Build your baseline"
    file: onboarding_complete.yaml
- launchApp:
    intent: "android.intent.action.VIEW"
    component: "com.impulsive.app/.MainActivity"
    extras:
      "navigate_to": "weekly_check_in"
- assertVisible: "WEEKLY REFLECTION"
- assertVisible: "Confirm Adjustment"
- tapOn: "Confirm Adjustment"
- assertVisible: "HOME"
