appId: com.impulsive.app
---
- launchApp
- runFlow:
    when:
      visible: "Build your baseline"
    file: onboarding_complete.yaml
# Here we simulate triggering via intent, or we can just open the InterceptActivity directly. 
# Since we can't easily long-press a precise element with progress via Maestro natively for exactly 15s in a specific UI bounds, we simulate the outcome or use an intent.
# Here we launch the deep link or intent to intercept:
- launchApp:
    intent: "android.intent.action.VIEW"
    component: "com.impulsive.app/.ui.intercept.InterceptActivity"
- assertVisible: "PAUSE."
- longPressOn:
    id: "friction_button"
    duration: 15000
- assertVisible: "Bored"
- tapOn: "Bored"
- assertVisible: "WALK AWAY"
- tapOn: "WALK AWAY"
- assertVisible: "That was real. That matters."
