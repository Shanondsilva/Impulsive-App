appId: com.impulsive.app
name: Walk Away Flow
---
- launchApp:
    appId: com.impulsive.app

# Start from the gateway screen directly
- startActivity:
    appId: com.impulsive.app
    activity: .ui.gateway.GatewayScreen

# ── Gateway ─────────────────────────────────────────────────────────────────
- assertVisible: "Walk Away"
- tapOn: "Walk Away"

# ── Walk Away screen ─────────────────────────────────────────────────────────
- assertVisible: "That was real. That matters."

# Screen must auto-dismiss within 3 seconds
- wait: 3500
- assertNotVisible: "That was real. That matters."
