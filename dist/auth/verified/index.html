<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email verified | Impulsive</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fffefc;
        --text: #211b2c;
        --muted: #655d72;
        --accent: #7d5fc4;
        --accent-strong: #6448a8;
        --panel: #ffffff;
        --ring: #eadff8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, #f6efff 0, transparent 34rem),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 440px);
        padding: 32px 28px;
        border: 1px solid var(--ring);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(76, 55, 118, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 2.75rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .helper {
        margin-top: 14px;
      }

      button {
        width: 100%;
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        background: var(--accent);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 14px 28px rgba(100, 72, 168, 0.22);
      }

      button:focus-visible {
        outline: 3px solid #d9c9f2;
        outline-offset: 3px;
      }

      button:hover {
        background: var(--accent-strong);
      }

      a {
        display: inline-block;
        margin-top: 18px;
        color: var(--accent-strong);
        font-size: 0.95rem;
        font-weight: 650;
        text-decoration: none;
      }

      a:focus-visible,
      a:hover {
        text-decoration: underline;
      }
    </style>
    <script>
      function openImpulsive() {
        window.location.href = "impulsive://auth/verified";
      }

      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(openImpulsive, 400);
      });
    </script>
  </head>
  <body>
    <main>
      <h1>Email verified</h1>
      <p>Your email has been verified. We are opening Impulsive now.</p>
      <p class="helper">If the app does not open automatically, tap the button below.</p>
      <button onclick="openImpulsive()">Open Impulsive</button>
      <a href="/">Back to Impulsive website</a>
    </main>
  </body>
</html>
